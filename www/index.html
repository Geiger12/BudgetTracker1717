<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TapBudget</title>
<meta name="description" content="Track which bills you have paid, and when.">
<meta name="theme-color" content="#2ebfd9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12212a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TapBudget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===== design tokens: cyan + yellow, one set of roles used everywhere ===== */
:root {
  --bg:#f2f3f5; --surface:#ffffff; --surface-2:#f5f7f8; --text:#1f2933; --text-muted:#5b6770; --border:#e1e6ea; --track:#e3e8ec;
  --ink:#1f2933; --brand:#2ebfd9; --on-brand:#1f2933;            /* bright cyan fills (status strip) carry dark text */
  --primary:#0e7c91; --primary-fg:#ffffff;                       /* deep cyan: buttons and section bars, white text passes contrast */
  --accent:#fdcb2f; --accent-fg:#1f2933;                         /* yellow: highlights, selected chips, the Add button */
  --success:#19a35a; --warning:#f59e0b; --danger:#e5372f; --info:#2ebfd9; --info-soft:#b8e6ee;
  --success-soft:#e1f3e8; --warning-soft:#fef3c7; --danger-soft:#fde8e6;
  --success-text:#13804a; --warning-text:#92400e; --danger-text:#c62828;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px; --tap:44px;
  --fs-xs:12px; --fs-sm:14px; --fs-md:16px; --fs-lg:18px; --fs-xl:24px;
  --shadow-1:0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.05);
  --shadow-2:0 8px 28px rgba(16,24,40,.22);
  --scrim:rgba(15,23,42,.48);
  --g-rgb:255,255,255; --g-edge:rgba(255,255,255,.85); --g-edge2:rgba(255,255,255,.45); --g-ring:rgba(16,24,40,.09); --g-sheen-a:.34;   /* glass look only */
  /* older names used by the page script and charts, mapped onto the roles above */
  --card:var(--surface); --panel:var(--surface-2); --fg:var(--text); --muted:var(--text-muted); --line:var(--border);
  --navy:var(--primary); --olive:var(--brand); --green:var(--success); --amber:var(--warning); --red:var(--danger); --blue:var(--info); --blue-soft:var(--info-soft);
  --bad:var(--danger-text); --warn:var(--warning-text); --ok:var(--success-text); --bad-soft:var(--danger-soft); --warn-soft:var(--warning-soft); --ok-soft:var(--success-soft);
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b1519; --surface:#12212a; --surface-2:#172a34; --text:#e8f1f4; --text-muted:#9bb0b8; --border:#243a44; --track:#27404a;
    --brand:#28afc8; --on-brand:#0b1a20; --primary:#2ebfd9; --primary-fg:#0b1a20; --accent:#fdcb2f; --accent-fg:#1f2933;
    --success:#2cc275; --warning:#f6ad37; --danger:#ff6a60; --info:#2ebfd9; --info-soft:#1f5563;
    --success-soft:#143426; --warning-soft:#3a2d14; --danger-soft:#3b1f1c; --success-text:#6fdca1; --warning-text:#f6c36b; --danger-text:#ff8a80;
    --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 28px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6); color-scheme: dark;
    --g-rgb:18,33,42; --g-edge:rgba(255,255,255,.2); --g-edge2:rgba(255,255,255,.1); --g-ring:rgba(0,0,0,.4); --g-sheen-a:.1;
  }
}
:root[data-theme="dark"] {
  --bg:#0b1519; --surface:#12212a; --surface-2:#172a34; --text:#e8f1f4; --text-muted:#9bb0b8; --border:#243a44; --track:#27404a;
  --brand:#28afc8; --on-brand:#0b1a20; --primary:#2ebfd9; --primary-fg:#0b1a20; --accent:#fdcb2f; --accent-fg:#1f2933;
  --success:#2cc275; --warning:#f6ad37; --danger:#ff6a60; --info:#2ebfd9; --info-soft:#1f5563;
  --success-soft:#143426; --warning-soft:#3a2d14; --danger-soft:#3b1f1c; --success-text:#6fdca1; --warning-text:#f6c36b; --danger-text:#ff8a80;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 8px 28px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6); color-scheme: dark;
    --g-rgb:18,33,42; --g-edge:rgba(255,255,255,.2); --g-edge2:rgba(255,255,255,.1); --g-ring:rgba(0,0,0,.4); --g-sheen-a:.1;
}

/* ===== base ===== */
* { touch-action:manipulation; }                  /* no double-tap zoom: the home-screen app has no way to zoom back out */
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 61px) + var(--strip-h, 56px) + 16px); }
* { box-sizing: border-box; }
[hidden] { display:none !important; }
body { margin:0; background:var(--bg); color:var(--text); font:var(--fs-md)/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body.noscroll { overflow:hidden; }
.wrap { max-width:980px; margin:0 auto; padding:var(--s4) var(--s4) calc(104px + env(safe-area-inset-bottom, 0px)); }
h1 { font-size:var(--fs-lg); margin:0; letter-spacing:-0.01em; font-weight:750; line-height:1.15; }
h2 { font-size:var(--fs-lg); margin:0; }
h3 { font-size:var(--fs-md); margin:0 0 var(--s3); }
.sub { color:var(--text-muted); margin:0; font-size:var(--fs-sm); }
button { font:inherit; color:inherit; cursor:pointer; }
:focus-visible { outline:2px solid var(--info); outline-offset:2px; }

/* ===== controls: one button family, one input family ===== */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); min-height:var(--tap); padding:0 var(--s4); border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:var(--r-md); font-weight:600; }
.btn:hover { border-color:var(--primary); }
.btn.primary { background:var(--primary); border-color:var(--primary); color:var(--primary-fg); }
.btn.primary:hover { filter:brightness(1.1); }
.btn.accent { background:var(--accent); border-color:var(--ink); color:var(--accent-fg); }
.btn.accent:hover { filter:brightness(1.05); border-color:var(--ink); }
.btn.danger { color:var(--danger-text); }
.btn.small { min-height:36px; padding:0 var(--s3); font-size:var(--fs-sm); }
.iconbtn { width:var(--tap); height:var(--tap); display:inline-grid; place-items:center; border:0; background:transparent; border-radius:var(--r-md); color:var(--text); flex:none; }
.iconbtn:hover { background:var(--surface-2); }
.iconbtn svg, .menu-item svg, .btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
input, select, textarea { font:inherit; font-size:16px; /* 16px or larger stops iPhone Safari from zooming in when a field is focused */ color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:var(--r-sm); padding:var(--s2) var(--s3); min-height:40px; }
textarea { width:100%; resize:vertical; }
input[type=number] { width:104px; }
input.day { width:64px; }
input[type=checkbox] { min-height:0; width:20px; height:20px; }

/* ===== app bar ===== */
.appbar { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--border); box-shadow:var(--shadow-1); }
.appbar-in { max-width:980px; margin:0 auto; padding:var(--s2) var(--s4); display:flex; align-items:center; gap:var(--s3); min-height:60px; }
.appbar .titles { flex:1; min-width:0; }
.appbar .sub { font-size:var(--fs-xs); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ===== status strip ===== */
.strip { position:sticky; top:calc(var(--appbar-h, 61px) + 6px); z-index:25; display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:1px; background:rgba(255,255,255,.32); border-radius:var(--r-lg); overflow:hidden; box-shadow:0 -7px 0 0 var(--bg), var(--shadow-1); color:var(--on-brand); }   /* pinned under the app bar on every tab */
.strip .cell { background:var(--brand); padding:var(--s3) var(--s4); min-width:0; }
.strip .lab { font-size:11px; letter-spacing:.09em; text-transform:uppercase; opacity:.9; font-weight:600; }
.strip .val { font-weight:700; display:flex; align-items:center; gap:var(--s2); min-height:40px; flex-wrap:wrap; }
.strip select { background:#fff; color:#1b2333; border:0; border-radius:var(--r-sm); font-weight:700; min-height:40px; width:100%; font-size:var(--fs-md); }
.monthnav { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.monthgroup { display:flex; align-items:center; gap:6px; flex-wrap:nowrap; }
#monthLabel { white-space:nowrap; }
.monthnav #monthLabel { min-width:112px; text-align:center; }
.nav { background:rgba(31,41,51,.14); border:0; color:var(--on-brand); border-radius:var(--r-sm); min-width:36px; min-height:36px; font-size:18px; line-height:1; padding:0 var(--s2); }
.nav.txt { font-size:var(--fs-xs); font-weight:600; }
.dot { width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.8); flex:none; }
.dot.green { background:var(--success); } .dot.amber { background:var(--warning); } .dot.red { background:var(--danger); }
#monthLabel .short { display:none; }
@media (max-width:900px) {
  #monthLabel .full { display:none; } #monthLabel .short { display:inline; }
  .monthnav #monthLabel { min-width:0; }
  .nav { min-width:32px; } .monthgroup { gap:4px; }
}
@media (max-width:760px) { .strip { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:420px) { .strip .cell { padding:var(--s3) 10px; } #monthLabel { font-size:14px; } .nav { min-width:30px; } }
@media (max-width:340px) { #monthLabel { font-size:13px; } .nav { min-width:28px; padding:0 4px; } .monthgroup { gap:2px; } }

/* ===== surfaces: every card, panel and callout shares one look ===== */
.summary, .card, .callout, .panel, .week { background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-lg); }
.summary, .callout { padding:var(--s4); margin-top:var(--s3); }
.callout { border-left:4px solid var(--accent); font-size:var(--fs-sm); }
.callout .btn { margin:2px 0; }
.summary h2 { font-size:var(--fs-sm); margin:0 0 6px; }
.summary ul { list-style:none; margin:0; padding:0; }
.summary li { display:flex; gap:var(--s2); font-size:var(--fs-sm); padding:1px 0; }
.summary li::before { content:"›"; color:var(--text-muted); }
.panel { background:var(--surface); padding:var(--s4); margin-top:var(--s4); box-shadow:var(--shadow-1); }
.panel h3 { font-size:var(--fs-lg); }
.panel h3 + .sub { margin:calc(var(--s2) * -1) 0 var(--s3); }
.banner { margin-top:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r-md); background:var(--warning-soft); color:var(--warning-text); font-size:var(--fs-sm); }
.card { padding:var(--s3) var(--s4); min-width:0; }
.donuts { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:var(--s3); margin-top:var(--s3); }
.ptitle { display:block; width:max-content; max-width:100%; margin:0 auto var(--s3); background:var(--primary); color:var(--primary-fg); font-weight:700; font-size:var(--fs-sm); padding:5px var(--s4); border-radius:var(--r-sm); text-align:center; }
.donut svg { display:block; margin:0 auto; overflow:visible; width:140px; height:140px; }
.donut .dbig { font-size:22px; font-weight:750; fill:var(--text); }
.donut .dsmall { font-size:11px; fill:var(--text-muted); }
.legend { display:flex; flex-wrap:wrap; gap:3px var(--s3); justify-content:center; font-size:var(--fs-xs); color:var(--text-muted); margin-top:var(--s2); }
.legend i { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }

/* ===== section bars + lists ===== */
.bar-title { background:var(--primary); color:var(--primary-fg); text-align:center; font-weight:700; padding:var(--s3) var(--s4); border-radius:var(--r-lg) var(--r-lg) 0 0; position:relative; }
.bar-title .count { position:absolute; right:var(--s4); top:50%; transform:translateY(-50%); font-size:var(--fs-xs); font-weight:500; opacity:.9; }
@media (max-width:480px) { .bar-title .count { position:static; transform:none; display:block; font-size:11px; } }
section.group, #schedule:not(:empty), #planned:not(:empty) { margin-top:var(--s4); }
.list { background:var(--surface); border:1px solid var(--border); border-top:0; border-radius:0 0 var(--r-lg) var(--r-lg); overflow:hidden; box-shadow:var(--shadow-1); }
.weeks { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:var(--s2); background:var(--surface-2); padding:var(--s3); border:1px solid var(--border); border-top:0; border-radius:0 0 var(--r-lg) var(--r-lg); }
.week { background:var(--surface); border-radius:var(--r-md); padding:var(--s2); min-width:0; }
.week.now { border-color:var(--primary); box-shadow:0 0 0 1px var(--primary); }
.week h4 { margin:0 0 var(--s1); font-size:var(--fs-xs); color:var(--text-muted); font-weight:600; }
.chip { display:flex; flex-wrap:wrap; gap:2px 6px; align-items:baseline; border-left:4px solid var(--info); background:var(--surface-2); border-radius:6px; padding:var(--s1) 6px; margin-top:var(--s1); font-size:var(--fs-xs); min-width:0; }
.chip b { font-variant-numeric:tabular-nums; min-width:16px; }
.chip .n { flex:1 1 9ch; min-width:min-content; overflow-wrap:normal; word-break:normal; }
.chip .a { font-variant-numeric:tabular-nums; color:var(--text-muted); white-space:nowrap; margin-left:auto; }
.chip.paid { border-color:var(--success); opacity:.7; } .chip.paid .n { text-decoration:line-through; text-decoration-thickness:1px; }
.chip.overdue { border-color:var(--danger); } .chip.soon { border-color:var(--warning); } .chip.inc { border-color:var(--success); }
.none { font-size:var(--fs-xs); color:var(--text-muted); padding:var(--s1) 0; }
.chart svg { display:block; overflow:visible; max-width:100%; }
.chart text { font-size:11px; fill:var(--text-muted); font-family:inherit; }
.chart .grid { stroke:var(--border); }

/* ===== rows ===== */
.row { padding:var(--s3) var(--s4); border-top:1px solid var(--border); }
.row:first-child { border-top:0; }
.line { display:flex; align-items:center; gap:var(--s3); }
.sw { flex:none; width:48px; height:30px; border-radius:var(--r-pill); border:0; background:var(--track); position:relative; padding:0; transition:background .15s; }
.sw::after { content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s; }
.sw[aria-checked="true"] { background:var(--success); }
.sw[aria-checked="true"]::after { transform:translateX(18px); }
.main { flex:1; min-width:0; }
.name { font-weight:600; overflow-wrap:anywhere; }
.row.paid .name { color:var(--text-muted); text-decoration:line-through; text-decoration-thickness:1px; }
.meta { color:var(--text-muted); font-size:var(--fs-sm); display:flex; flex-wrap:wrap; gap:var(--s1) var(--s3); align-items:center; }
.tag { font-size:var(--fs-xs); padding:1px var(--s2); border-radius:var(--r-pill); background:var(--track); color:var(--text-muted); }
.tag.bad { background:var(--danger-soft); color:var(--danger-text); }
.tag.warn { background:var(--warning-soft); color:var(--warning-text); }
.tag.ok { background:var(--success-soft); color:var(--success-text); }
.amt { font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap; }
.amt.in { color:var(--success-text); }
.detail { display:flex; flex-wrap:wrap; gap:var(--s2) var(--s4); align-items:center; margin:var(--s3) 0 0 60px; font-size:var(--fs-sm); color:var(--text-muted); }
.detail label { display:flex; align-items:center; gap:6px; }
.controls { display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; margin:var(--s3) 0 0 60px; font-size:var(--fs-sm); color:var(--text-muted); }
.bar { height:8px; background:var(--track); border-radius:var(--r-pill); overflow:hidden; margin-top:var(--s2); }
.bar > i { display:block; height:100%; background:var(--primary); border-radius:var(--r-pill); transition:width .25s ease; }
.bar.over > i { background:var(--danger); }
.vrow .vline { display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap; }
.vrow .main { min-width:150px; }
.vrow .spent { display:flex; align-items:center; gap:var(--s2); font-size:var(--fs-sm); color:var(--text-muted); }
.fields { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:var(--s3); }
.fields label { display:flex; flex-direction:column; gap:var(--s1); font-size:var(--fs-sm); color:var(--text-muted); }
.fields input, .fields select { width:100%; }
.actions { display:flex; gap:var(--s2); margin-top:var(--s4); flex-wrap:wrap; }
.empty { padding:var(--s5) var(--s4); text-align:center; color:var(--text-muted); }
.foot-note { margin-top:var(--s5); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ===== slide-out menu ===== */
.scrim { position:fixed; inset:0; background:var(--scrim); opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:40; }
.scrim.open { opacity:1; pointer-events:auto; }
.drawer { --dr-text:#e8f1f4; --dr-muted:#9bb0b8; --dr-line:rgba(255,255,255,.11); position:fixed; top:calc(env(safe-area-inset-top, 0px) + 8px); bottom:calc(env(safe-area-inset-bottom, 0px) + 8px); left:8px; width:min(88vw, 340px); z-index:50; display:flex; flex-direction:column; color:var(--dr-text); background:linear-gradient(165deg, #1a2b35 0%, #0d1a21 70%); border:1px solid var(--dr-line); border-radius:28px; box-shadow:0 18px 50px rgba(0,0,0,.5); transform:translateX(calc(-100% - 32px)); visibility:hidden; transition:transform .3s cubic-bezier(.2,.8,.2,1), width .26s ease, visibility 0s linear .3s; }
.drawer:focus { outline:none; }
.drawer.open { transform:none; visibility:visible; transition:transform .3s cubic-bezier(.2,.8,.2,1), width .26s ease; }
.drawer [hidden] { display:none !important; }
.drawer-head { display:flex; align-items:center; gap:var(--s3); padding:var(--s4) var(--s3) var(--s2) var(--s4); }
.drawer-head .titles { flex:1; min-width:0; }
.drawer-logo { flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:var(--brand); color:var(--on-brand); font-weight:800; font-size:20px; box-shadow:0 0 0 3px rgba(255,255,255,.08); }
.drawer-head .iconbtn { color:var(--dr-muted); }
.drawer-head .iconbtn:hover { background:rgba(255,255,255,.1); color:#fff; }
.drawer-title { font-weight:750; font-size:var(--fs-lg); color:#fff; }
.drawer-sub { font-size:var(--fs-xs); color:var(--dr-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drawer-toggle { position:absolute; right:-14px; top:30px; width:30px; height:30px; padding:0; border-radius:50%; border:1px solid var(--dr-line); background:#0d1a21; color:var(--dr-text); display:grid; place-items:center; box-shadow:0 2px 8px rgba(0,0,0,.4); }
.drawer-toggle::after { content:""; position:absolute; inset:-8px; }
.drawer-toggle svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.drawer-toggle:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.drawer-search { position:relative; margin:var(--s2) var(--s4) var(--s1); }
.drawer-search svg { position:absolute; left:13px; top:50%; transform:translateY(-50%); width:20px; height:20px; fill:none; stroke:var(--dr-muted); stroke-width:2; stroke-linecap:round; stroke-linejoin:round; pointer-events:none; }
.drawer-search input { width:100%; min-height:46px; padding:0 var(--s3) 0 42px; background:rgba(255,255,255,.06); border:1px solid var(--dr-line); border-radius:15px; color:var(--dr-text); }
.drawer-search input::placeholder { color:var(--dr-muted); opacity:1; }
.drawer-search input:focus { outline:2px solid var(--brand); outline-offset:1px; }
.drawer-body { overflow-y:auto; overscroll-behavior:contain; padding:var(--s1) var(--s3) var(--s5); flex:1; }
.drawer h2 { font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--dr-muted); margin:var(--s4) var(--s3) var(--s1); font-weight:700; }
.drawer-none { margin:var(--s4) var(--s3) 0; }

<script>
(function () {
  "use strict";
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const pad = (n) => String(n).padStart(2, "0");
  const isoOf = (y, m, d) => y + "-" + pad(m + 1) + "-" + pad(d);           // m is 0-based
  const todayISO = () => { const t = new Date(); return isoOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const dayNum = (y, m, d) => Math.round(Date.UTC(y, m, d) / 864e5);
  const fromDayNum = (n) => { const t = new Date(n * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
  const daysIn = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  const parseISO = (s) => { const [y, m, d] = s.split("-").map(Number); return { y, m: m - 1, d }; };
  const niceDate = (iso) => { const p = parseISO(iso); const w = new Date(Date.UTC(p.y, p.m, p.d)).getUTCDay(); return DOW[w] + ", " + MONTHS[p.m].slice(0, 3) + " " + p.d; };
  const fmt = (v) => { const n = Math.abs(v); const s = Number.isInteger(+n.toFixed(2)) ? n.toLocaleString("en-CA", { maximumFractionDigits: 0 }) : n.toLocaleString("en-CA", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (v < 0 ? "−$" : "$") + s; };

  const state = { items: [], pay: new Map(), y: new Date().getFullYear(), m: new Date().getMonth(), manage: false, adding: false, ready: true, mode: "saved", note: "", budgets: {}, activeId: null, panel: false, pending: null, renaming: null, importText: "", sharing: false, importOpen: false, drawer: false, tab: "overview", billFilter: "all", spendFilter: "all", billView: "list", overdueCount: 0, themeOpen: false, loans: [], loanEdit: null, loanPay: null };
  let itemsCol = null, payCol = null;

  /* ---------- storage: this device's localStorage, one entry holding every budget ---------- */
  const KEY = "budget-tracker:v2", OLD_KEY = "budget-tracker:v1";
  const TYPES = ["income", "bill", "variable"];
  const ISO = /^\d{4}-\d{2}-\d{2}$/;
  const uid = () => "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const slug = (s) => (String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "budget").slice(0, 40);
  const curName = () => (state.budgets[state.activeId] || {}).name || "My budget";
  function loadActive() {
    const b = state.budgets[state.activeId];
    state.items = Array.isArray(b.items) ? b.items : [];
    state.pay = new Map(Object.entries(b.pay || {}));
    state.loans = Array.isArray(b.loans) ? b.loans : []; state.loanEdit = null; state.loanPay = null;
  }
  function load() {
    let fresh = false, seeded = false, added = false;
    try {
      let d = null;
      const raw = localStorage.getItem(KEY);
      if (raw) d = JSON.parse(raw);
      else {
        fresh = true;
        const old = localStorage.getItem(OLD_KEY);           // single-budget version: carry it over
        if (old) { fresh = false; const o = JSON.parse(old), id = uid(); d = { active: id, budgets: { [id]: { name: "My budget", items: o.items || [], pay: o.pay || {} } } }; }
      }
      if (d && d.budgets && Object.keys(d.budgets).length) { state.budgets = d.budgets; state.activeId = d.budgets[d.active] ? d.active : Object.keys(d.budgets)[0]; seeded = !!d.seeded; }
    } catch (e) { state.mode = "local"; }
    if (!state.activeId || !state.budgets[state.activeId]) { state.budgets = {}; state.activeId = uid(); state.budgets[state.activeId] = fresh ? (() => { const it = sampleItems(); return { name: "Example budget", items: it, pay: samplePay(it), loans: sampleLoans(), sample: true }; })() : { name: "My budget", items: [], pay: {} }; }
    if (!fresh && !seeded) { state.budgets[uid()] = exampleBudget(); added = true; }     // existing installs get the example once, so it shows in the list
    for (const b of Object.values(state.budgets)) if (b.sample) { const have = new Set((b.loans || []).map((l) => l.id)); for (const l of sampleLoans()) { if (!have.has(l.id)) { b.loans = (b.loans || []).concat([l]); added = true; } else if (l.kind === "card") { const cur = b.loans.find((x) => x.id === l.id); if (cur && !(cur.payment > 0)) { cur.payment = l.payment; added = true; } } } }
    loadActive();
    if (fresh || added) persist();      // keep the example stable from the first visit
  }
  function persist() {
    const b = state.budgets[state.activeId];
    b.items = state.items; b.pay = Object.fromEntries(state.pay); b.loans = state.loans;
    if (state.mode === "local") return;
    try { localStorage.setItem(KEY, JSON.stringify({ version: 2, active: state.activeId, budgets: state.budgets, seeded: true })); }
    catch (e) { state.mode = "local"; }
  }
  function switchTo(id) { if (!state.budgets[id]) return; persist(); state.activeId = id; loadActive(); state.manage = false; state.adding = false; state.panel = false; state.renaming = null; state.note = ""; persist(); render(); }
  function deleteBudget(id) {
    persist(); delete state.budgets[id];
    if (!Object.keys(state.budgets).length) state.budgets[uid()] = { name: "My budget", items: [], pay: {} };
    if (!state.budgets[state.activeId]) state.activeId = Object.keys(state.budgets)[0];
    loadActive(); persist(); render();
  }
  const upsert = (arr, it) => { const i = arr.findIndex((x) => x.id === it.id); if (i >= 0) arr[i] = it; else arr.push(it); };
  const store = {
    setItem(it) { state.budgets[state.activeId].sample = false; upsert(state.items, it); persist(); render(); },
    delItem(id) { state.budgets[state.activeId].sample = false; state.items = state.items.filter((x) => x.id !== id); for (const [k, v] of Array.from(state.pay)) if (v.item === id) state.pay.delete(k); persist(); render(); },
    setPay(key, p) { state.pay.set(key, p); persist(); render(); },
    delPay(key) { state.pay.delete(key); persist(); render(); },
    setLoan(l) { state.budgets[state.activeId].sample = false; upsert(state.loans, l); persist(); render(); },
    delLoan(id) { state.budgets[state.activeId].sample = false; state.loans = state.loans.filter((x) => x.id !== id); persist(); render(); }
  };

  /* ---------- backup and restore (one file per budget) ---------- */
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const str = (v, max) => (typeof v === "string" ? v.slice(0, max) : "");
  function cleanItem(x) {
    if (!x || typeof x.id !== "string" || !x.id || !TYPES.includes(x.type) || num(x.amount) == null || x.amount < 0) return null;
    const it = { id: str(x.id, 80), name: str(x.name, 60) || "Untitled", type: x.type, amount: x.amount, account: str(x.account, 40), order: num(x.order) || 0, freq: x.freq === "biweekly" ? "biweekly" : "monthly" };
    if (it.freq === "biweekly") { if (!ISO.test(x.anchor || "")) return null; it.anchor = x.anchor; }
    else if (it.type !== "variable") it.day = Math.min(31, Math.max(1, Math.round(num(x.day) || 1)));
    if (x.recurring === true && it.type !== "variable") { it.recurring = true; it.autoSince = ISO.test(x.autoSince || "") ? x.autoSince : todayISO(); }
    return it;
  }
  function cleanLoan(x) {
    if (!x || typeof x.id !== "string" || !x.id) return null;
    const total = num(x.total), balance = num(x.balance), payment = num(x.payment);
    if (total == null || total < 0 || balance == null || balance < 0) return null;
    const card = x.kind === "card";
    return { id: str(x.id, 80), name: str(x.name, 60) || (card ? "Credit card" : "Loan"), kind: card ? "card" : "loan", total, balance, payment: payment == null || payment < 0 ? 0 : payment };
  }
  function cleanPay(raw, items) {
    const out = {};
    for (const [k, v] of Object.entries(raw || {})) {
      if (v && typeof v.item === "string" && items.some((i) => i.id === v.item)) out[String(k).slice(0, 120)] = { item: v.item, due: ISO.test(v.due || "") ? v.due : null, on: ISO.test(v.on || "") ? v.on : todayISO(), amt: num(v.amt) ?? 0 };
    }
    return out;
  }
  async function backup() {
    persist();
    const name = curName();
    const data = JSON.stringify({ app: "budget-tracker", version: 2, name, items: state.items, pay: Object.fromEntries(state.pay), loans: state.loans }, null, 2);
    const fileName = "budget-" + slug(name) + "-" + todayISO() + ".json";
    const file = new File([data], fileName, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name + " budget backup" }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = fileName; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  async function stageRestore(file) {
    try { stageData(JSON.parse(await file.text()), file.name); }
    catch (e) { state.pending = null; state.note = "That file couldn’t be read as a budget backup."; render(); }
  }
  function stageData(d, fileName) {
    try {
      const items = (Array.isArray(d.items) ? d.items : []).map(cleanItem).filter(Boolean);
      const loans = Array.isArray(d.loans) ? d.loans.map(cleanLoan).filter(Boolean) : null;
      if (!items.length && !(loans && loans.length)) throw new Error("no items");
      const fromFile = String(fileName || "").replace(/\.json$/i, "").replace(/^budget-/, "").replace(/-\d{4}-\d{2}-\d{2}$/, "").replace(/[-_]+/g, " ").trim().replace(/\b\w/g, (c) => c.toUpperCase());
      const name = str(d.name, 60).trim() || fromFile || "Imported budget";
      state.pending = { name, items, pay: cleanPay(d.pay, items), loans, fileName: fileName || "pasted text" };
      state.note = ""; state.panel = false; state.importOpen = false; state.sharing = false; render();
      const rh = document.getElementById("restoreHost"); if (rh && rh.scrollIntoView) rh.scrollIntoView({ block: "nearest" });
    } catch (e) { state.pending = null; state.note = "That doesn’t look like a budget link or backup."; render(); }
  }

  /* ---------- move a budget without files: link or text ---------- */
  const b64u = (u8) => { let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
  const unb64u = (t) => { t = t.replace(/-/g, "+").replace(/_/g, "/"); while (t.length % 4) t += "="; const s = atob(t), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
  async function pipe(Stream, kind, bytes) { const s = new Stream(kind), w = s.writable.getWriter(); w.write(bytes); w.close(); return new Uint8Array(await new Response(s.readable).arrayBuffer()); }
  async function toToken(obj) {
    const bytes = new TextEncoder().encode(JSON.stringify(obj));
    if (typeof CompressionStream !== "undefined") { try { return "z." + b64u(await pipe(CompressionStream, "deflate-raw", bytes)); } catch (e) { /* fall through */ } }
    return "u." + b64u(bytes);
  }
  async function fromToken(tok) {
    const kind = tok.slice(0, 1), bytes = unb64u(tok.slice(2));
    if (kind === "z") {
      if (typeof DecompressionStream === "undefined") throw new Error("needs newer browser");
      return JSON.parse(new TextDecoder().decode(await pipe(DecompressionStream, "deflate-raw", bytes)));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  }
  function payload(withHistory) {
    persist();
    return { app: "budget-tracker", version: 2, name: curName(), items: state.items, pay: withHistory ? Object.fromEntries(state.pay) : {}, loans: state.loans };
  }
  async function makeLink(withHistory) { return location.href.split("#")[0] + "#b=" + await toToken(payload(withHistory)); }
  async function importText(text) {
    const t = String(text || "").trim();
    if (!t) { state.note = "Paste a budget link or backup text first."; render(); return; }
    try {
      let d;
      const hit = t.match(/[#?&]b=([uz]\.[A-Za-z0-9_-]+)/) || t.match(/^([uz]\.[A-Za-z0-9_-]+)$/);
      if (hit) d = await fromToken(hit[1]);
      else if (t[0] === "{") d = JSON.parse(t);
      else throw new Error("unrecognised");
      state.importText = ""; stageData(d, "");
    } catch (e) { state.note = /newer/.test(e.message) ? "This link needs iOS 16.4 or newer to open." : "That doesn’t look like a budget link or backup."; render(); }
  }
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); state.note = okMsg; }
    catch (e) { state.note = "Couldn’t copy automatically. Try Share instead."; }
    render();
  }
  async function shareLink(withHistory) {
    const link = await makeLink(withHistory);
    if (navigator.share) { try { await navigator.share({ title: curName() + " budget", text: "TapBudget: " + curName(), url: link }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
    copyText(link, "Link copied. Paste it into the app on your other device.");
  }

  function applyRestore(target, newName, mode) {
    const p = state.pending; if (!p) return;
    persist();
    let id, label;
    if (target === "new") {
      id = uid(); label = newName.trim() || p.name;
      const samples = Object.keys(state.budgets).filter((k) => state.budgets[k].sample);
      if (samples.length === 1 && Object.keys(state.budgets).length === 1) delete state.budgets[samples[0]];     // a lone, untouched example makes way
      const taken = Object.values(state.budgets).map((b) => b.name.toLowerCase());
      if (taken.includes(label.toLowerCase())) { let n = 2; while (taken.includes((label + " (" + n + ")").toLowerCase())) n++; label += " (" + n + ")"; }
      state.budgets[id] = { name: label, items: p.items, pay: p.pay, loans: p.loans || [] };
    } else {
      id = target; const b = state.budgets[id]; label = b.name;
      if (mode === "merge") {
        const map = new Map((b.items || []).map((i) => [i.id, i]));
        for (const i of p.items) map.set(i.id, i);
        b.items = Array.from(map.values()); b.pay = { ...(b.pay || {}), ...p.pay };
        if (p.loans) { const lm = new Map((b.loans || []).map((l) => [l.id, l])); for (const l of p.loans) lm.set(l.id, l); b.loans = Array.from(lm.values()); }
      } else { b.items = p.items; b.pay = p.pay; if (p.loans) b.loans = p.loans; }
    }
    state.activeId = id; loadActive();
    state.pending = null; state.panel = false; state.manage = false; state.adding = false;
    state.note = "Restored into “" + label + "” (" + state.items.length + " items).";
    persist(); render();
  }
  function exampleBudget() { const it = sampleItems(); return { name: "Example budget", items: it, pay: samplePay(it), loans: sampleLoans(), sample: true }; }
  function addExample(open) {
    persist();
    const existing = Object.keys(state.budgets).find((k) => state.budgets[k].sample);
    let id = existing;
    if (!id) {
      id = uid(); state.budgets[id] = exampleBudget();
      const taken = Object.values(state.budgets).filter((b) => b !== state.budgets[id]).map((b) => b.name.toLowerCase());
      if (taken.includes("example budget")) state.budgets[id].name = "Example budget (2)";
    }
    if (open) { state.activeId = id; loadActive(); state.panel = false; state.manage = false; state.adding = false; state.note = ""; }
    persist(); render();
  }
  function sampleItems() {
    const t = new Date(); const back = (t.getDay() + 2) % 7;         // most recent Friday
    const f = new Date(t.getFullYear(), t.getMonth(), t.getDate() - back);
    const sd = new Date(t.getFullYear(), t.getMonth() - 2, 1), since = isoOf(sd.getFullYear(), sd.getMonth(), 1);
    const mk = (n, id, name, type, amount, day, account) => ({ id: "sample-" + id, name, type, amount, freq: "monthly", ...(day ? { day } : {}), account, order: n });
    return [
      { id: "sample-pay", name: "Paycheck", type: "income", amount: 2150, freq: "biweekly", anchor: isoOf(f.getFullYear(), f.getMonth(), f.getDate()), account: "Chequing", order: 1 },
      mk(2, "rent", "Rent", "bill", 1350, 1, "E-transfer"),
      mk(3, "streaming", "Streaming", "bill", 18, 5, "Credit card"),
      { ...mk(4, "power", "Electricity", "bill", 95, 8, "Auto-pay"), recurring: true, autoSince: since },
      mk(5, "gym", "Gym", "bill", 30, 10, "Credit card"),
      mk(6, "internet", "Internet", "bill", 65, 12, "Credit card"),
      mk(7, "phone", "Phone", "bill", 55, 15, "Credit card"),
      { ...mk(8, "car", "Car insurance", "bill", 140, 20, "Auto-pay"), recurring: true, autoSince: since },
      mk(9, "savings", "Savings transfer", "bill", 150, 21, "Chequing"),
      mk(10, "card", "Credit card payment", "bill", 200, 25, "Chequing"),
      mk(11, "groceries", "Groceries", "variable", 450, 0, "Chequing"),
      mk(12, "gas", "Gas", "variable", 120, 0, "Chequing"),
      mk(13, "dining", "Dining out", "variable", 150, 0, "Chequing"),
      mk(14, "fun", "Fun money", "variable", 80, 0, "Chequing")
    ];
  }
  function sampleLoans() {
    return [
      { id: "sample-loan-car", name: "Car loan", kind: "loan", total: 18000, balance: 11250, payment: 385 },
      { id: "sample-loan-school", name: "Student loan", kind: "loan", total: 9000, balance: 3900, payment: 150 },
      { id: "sample-card-visa", name: "Rewards Visa", kind: "card", total: 6000, balance: 1850, payment: 150 },
      { id: "sample-card-store", name: "Store card", kind: "card", total: 2500, balance: 2050, payment: 50 }
    ];
  }
  function samplePay(items) {
    // Pretend the last two months, and the days so far this month, have been tracked, so the example looks lived in.
    const out = {}, t = new Date(), ty = t.getFullYear(), tm = t.getMonth(), td = t.getDate(), tISO = todayISO(), earlier = [0.93, 1.04];
    for (let back = 2; back >= 0; back--) {
      let mm = tm - back, yy = ty; while (mm < 0) { mm += 12; yy--; }
      for (const it of items) for (const o of occurrences(it, yy, mm)) {
        if (it.type === "variable") {
          const f = back === 0 ? 0.9 * td / daysIn(yy, mm) : earlier[2 - back];
          out[o.key] = { item: it.id, due: null, on: isoOf(yy, mm, back === 0 ? td : daysIn(yy, mm)), amt: Math.round(it.amount * f / 5) * 5 };
        } else if (o.due < tISO) out[o.key] = { item: it.id, due: o.due, on: o.due, amt: it.amount };
      }
    }
    return out;
  }
  function loadSample() { state.items = sampleItems(); state.pay = new Map(Object.entries(samplePay(state.items))); state.loans = sampleLoans(); state.budgets[state.activeId].sample = true; persist(); render(); }
  function startBlank() {
    const b = state.budgets[state.activeId];
    b.items = []; b.pay = {}; b.loans = []; b.sample = false; if (b.name === "Example budget") b.name = "My budget";
    loadActive(); state.manage = false; persist(); render();
  }

  /* ---------- schedule ---------- */
  function occurrences(item, y, m) {
    const out = [];
    if (item.type === "variable") { out.push({ item, due: null, key: item.id + "_" + y + "-" + pad(m + 1) }); return out; }

      for (const o of occurrences(it, state.y, state.m)) {
        const p = state.pay.get(o.key), r = map.get(it.name) || { name: it.name, planned: 0, done: 0 };
        r.planned += it.amount; r.done += p ? (p.amt ?? it.amount) : 0; map.set(it.name, r);
      }
    }
    let rows = Array.from(map.values()).sort((a, b) => b.planned - a.planned);
    const plannedOut = rows.reduce((s, r) => s + r.planned, 0), net = c.expIn - plannedOut;
    const card = (l, v, cls) => h("div", { class: "card" }, h("div", { class: "l" }, l), h("div", { class: "v " + (cls || "") }, v));
    gl.append(card("Expected income", fmt(c.expIn)), card("Planned spending", fmt(plannedOut)), card("Expected net", fmt(net), net >= 0 ? "pos" : "neg"));
    if (!rows.length) return;
    if (rows.length > 8) { const rest = rows.slice(7); rows = rows.slice(0, 7).concat([{ name: "Other (" + rest.length + ")", planned: rest.reduce((s, r) => s + r.planned, 0), done: rest.reduce((s, r) => s + r.done, 0) }]); }
    const scale = Math.max(1, ...rows.map((r) => Math.max(r.planned, r.done)));
    wh.append(h("div", { class: "bar-title" }, "Where the money goes"),
      h("div", { class: "list" }, rows.map((r) => h("div", { class: "hrow" },
        h("span", { class: "hn" }, r.name),
        h("div", { class: "hbar" + (r.done > r.planned ? " over" : ""), role: "img", "aria-label": r.name + ": " + fmt(r.done) + " of " + fmt(r.planned) },
          h("i", { class: "plan", style: "width:" + (r.planned / scale * 100) + "%" }), h("i", { class: "done", style: "width:" + (r.done / scale * 100) + "%" })),
        h("span", { class: "hv" }, fmt(r.planned)))),
        h("div", { class: "hlegend" }, h("span", {}, h("i", { style: "background:var(--primary)" }), "Paid or spent so far"), h("span", {}, h("i", { style: "background:var(--info-soft)" }), "Planned"))));
  }

  function group(title, rows, right) {
    return h("section", { class: "group" }, h("div", { class: "bar-title" }, title, right ? h("span", { class: "count" }, right) : null), h("div", { class: "list" }, rows));
  }

  function row(o) {
    const it = o.item, p = state.pay.get(o.key), paid = !!p;
    const d = daysUntil(o.due);
    let tag = null;
    if (paid) tag = h("span", { class: "tag ok" }, it.type === "income" ? "Received" : "Paid");
    else if (d < 0) tag = h("span", { class: "tag bad" }, it.type === "income" ? "Not received yet" : "Overdue");
    else if (d === 0) tag = h("span", { class: "tag warn" }, "Due today");
    else if (d <= 3) tag = h("span", { class: "tag warn" }, "Due in " + d + (d === 1 ? " day" : " days"));
    const auto = isAuto(it, o.due);
    const sw = auto
      ? h("button", { class: "sw lock" + (paid ? " on" : ""), "aria-label": "Automatic " + (it.type === "income" ? "deposit" : "withdrawal") + ": " + it.name + ", " + niceDate(o.due) + (paid ? ", paid" : ", not due yet"),
          onclick: () => showToast("“" + it.name + "” is automatic. It is marked paid on its due day. Change this in Settings.") }, ico("lock"))
      : h("button", {
          class: "sw", role: "switch", "aria-checked": String(paid),
          "aria-label": (it.type === "income" ? "Mark received: " : "Mark paid: ") + it.name + ", " + niceDate(o.due),
          onclick: () => paid ? store.delPay(o.key) : store.setPay(o.key, { item: it.id, due: o.due, on: todayISO(), amt: it.amount })
        });
    const autoTag = auto ? h("span", { class: "tag" }, "Automatic") : null;
    const amtShown = paid && p.amt != null ? p.amt : it.amount;
    const r = h("div", { class: "row" + (paid ? " paid" : "") },
      h("div", { class: "line" }, sw,
        h("div", { class: "main" }, h("div", { class: "name" }, it.name), h("div", { class: "meta" }, h("span", {}, niceDate(o.due) + (it.account ? " · " + it.account : "")), tag, autoTag)),
        h("div", { class: "amt" + (it.type === "income" ? " in" : "") }, (it.type === "income" ? "+" : "") + fmt(amtShown))));
    if (paid) r.append(h("div", { class: "detail" },
      h("label", {}, it.type === "income" ? "Received on" : "Paid on", h("input", { type: "date", value: p.on || todayISO(), "aria-label": "Date " + it.name + " was paid",
        onchange: (e) => { if (e.target.value) store.setPay(o.key, { ...p, on: e.target.value }); } })),
      h("label", {}, "Amount", h("input", { type: "number", step: "0.01", min: "0", value: String(p.amt ?? it.amount), "aria-label": "Amount actually paid for " + it.name,
        onchange: (e) => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) store.setPay(o.key, { ...p, amt: v }); } }))));
    if (state.manage) r.append(manageControls(it));
    return r;
  }

  function vrow(o) {
    const it = o.item, p = state.pay.get(o.key), spent = p ? p.amt || 0 : 0, over = spent > it.amount;
    const r = h("div", { class: "row vrow" },
      h("div", { class: "vline" },
        h("div", { class: "main" }, h("div", { class: "name" }, it.name), h("div", { class: "meta" }, "Budget " + fmt(it.amount) + (over ? "" : " · " + fmt(it.amount - spent) + " left"), over ? h("span", { class: "tag bad" }, fmt(spent - it.amount) + " over") : null)),
        h("div", { class: "spent" }, "Spent $", h("input", { type: "number", step: "0.01", min: "0", value: spent ? String(spent) : "", placeholder: "0", "aria-label": "Amount spent on " + it.name,
          onchange: (e) => { const v = parseFloat(e.target.value); if (!v || v <= 0) store.delPay(o.key); else store.setPay(o.key, { item: it.id, due: null, on: (p && p.on) || todayISO(), amt: v }); } }))),
      h("div", { class: "bar" + (over ? " over" : ""), role: "img", "aria-label": fmt(spent) + " of " + fmt(it.amount) + " spent" }, h("i", { style: "width:" + Math.min(100, Math.round((it.amount ? spent / it.amount : 0) * 100)) + "%" })));
    if (state.manage) r.append(manageControls(it));
    return r;
  }

  function manageControls(it) {
    let armed = false;
    const rm = h("button", { class: "btn small danger", onclick: () => { if (!armed) { armed = true; rm.textContent = "Tap again to remove"; return; } store.delItem(it.id); } }, "Remove");
    return h("div", { class: "controls" },
      h("label", {}, "Name", h("input", { type: "text", value: it.name, maxlength: "60", onchange: (e) => { const v = e.target.value.trim(); if (v) store.setItem({ ...it, name: v }); } })),
      h("label", {}, "Account", h("input", { type: "text", value: it.account || "", maxlength: "40", onchange: (e) => store.setItem({ ...it, account: e.target.value.trim() }) })),
      h("label", {}, "Amount $", h("input", { type: "number", step: "0.01", min: "0", value: String(it.amount), onchange: (e) => { const v = parseFloat(e.target.value); if (!isNaN(v) && v >= 0) store.setItem({ ...it, amount: v }); } })),
      it.type !== "variable" && it.freq !== "biweekly" ? h("label", {}, "Due day", h("input", { class: "day", type: "number", min: "1", max: "31", value: String(it.day || 1), onchange: (e) => { const v = parseInt(e.target.value, 10); if (v >= 1 && v <= 31) store.setItem({ ...it, day: v }); } })) : null,
      rm);
  }

  /* ---------- add item ---------- */
  function renderAdd() {
    const host = document.getElementById("addHost"); host.replaceChildren();
    if (!state.adding) return;
    const f = {};
    const field = (label, el) => h("label", {}, label, el);
    f.name = h("input", { type: "text", placeholder: "e.g. Gym", maxlength: "60" });
    f.type = h("select", {}, h("option", { value: "bill" }, "Bill"), h("option", { value: "income" }, "Money in"), h("option", { value: "variable" }, "Everyday spending"));
    f.amount = h("input", { type: "number", step: "0.01", min: "0", placeholder: "0.00" });
    f.freq = h("select", {}, h("option", { value: "monthly" }, "Every month"), h("option", { value: "biweekly" }, "Every 2 weeks"));
    f.day = h("input", { type: "number", min: "1", max: "31", placeholder: "1–31" });
    f.anchor = h("input", { type: "date", value: todayISO() });
    f.account = h("input", { type: "text", placeholder: "Optional", maxlength: "40" });
    const dayF = field("Due day of month", f.day), freqF = field("How often", f.freq), anchorF = field("First date", f.anchor);
    const sync = () => {
      const v = f.type.value === "variable", bi = f.freq.value === "biweekly" && !v;
      freqF.hidden = v; dayF.hidden = v || bi; anchorF.hidden = !bi;
    };
    f.type.addEventListener("change", sync); f.freq.addEventListener("change", sync);
    const err = h("div", { class: "sub", role: "alert" });
    const save = h("button", { class: "btn primary", onclick: () => {
      const name = f.name.value.trim(), amount = parseFloat(f.amount.value), type = f.type.value;
      if (!name) { err.textContent = "Please enter a name."; return; }
      if (isNaN(amount) || amount < 0) { err.textContent = "Please enter an amount."; return; }
      const it = { id: name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) + "-" + Date.now().toString(36), name, type, amount, account: f.account.value.trim(), order: Math.max(0, ...state.items.map((x) => x.order || 0)) + 1 };
      if (type === "variable") { it.freq = "monthly"; }
      else if (f.freq.value === "biweekly") { if (!f.anchor.value) { err.textContent = "Please pick the first date."; return; } it.freq = "biweekly"; it.anchor = f.anchor.value; }
      else { const d = parseInt(f.day.value, 10); if (!(d >= 1 && d <= 31)) { err.textContent = "Please enter a due day from 1 to 31."; return; } it.freq = "monthly"; it.day = d; }
      store.setItem(it); state.adding = false; state.note = "Added “" + it.name + "”."; render();
    } }, "Save item");
    host.append(h("div", { class: "panel" }, h("h3", {}, "Add an item"),
      h("div", { class: "fields" }, field("Name", f.name), field("Type", f.type), field("Amount ($)", f.amount), freqF, dayF, anchorF, field("Account", f.account)),
      err, h("div", { class: "actions" }, save, h("button", { class: "btn", onclick: () => { state.adding = false; render(); } }, "Cancel"))));
    sync();
  }

  /* ---------- controls ---------- */
  const step = (n) => { let m = state.m + n, y = state.y; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } state.m = m; state.y = y; render(); };
  $("menuBtn").addEventListener("click", () => setDrawer(!state.drawer));
  $("scrim").addEventListener("click", () => setDrawer(false));
  $("appAdd").addEventListener("click", () => openSheet("add"));
  $("sheetClose").addEventListener("click", closeSheet);
  $("sheetWrap").addEventListener("click", (e) => { if (e.target === $("sheetWrap")) closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (state.drawer) setDrawer(false); else if (!$("sheetWrap").hidden) closeSheet(); });
  /* swipe the menu in from the left edge (it follows your finger), and swipe it back to close */
  const EDGE = 24, drawerEl = $("drawer"), scrimEl = $("scrim");
  let drag = null;
  const closedX = () => -(drawerEl.offsetWidth + 32);
  function dragTo(x) {
    const cx = closedX(), progress = Math.max(0, Math.min(1, 1 - x / cx));
    drawerEl.style.transition = "none"; drawerEl.style.transform = "translateX(" + x + "px)";
    scrimEl.style.transition = "none"; scrimEl.style.opacity = String(progress);
    return progress;
  }
  document.addEventListener("touchstart", (e) => {
    drag = null;
    if (e.touches.length !== 1) return;
    const t = e.touches[0];
    if (state.drawer) { if (drawerEl.contains(e.target) || e.target === scrimEl) drag = { mode: "close", x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, x: 0 }; }
    else if (t.clientX <= EDGE && $("sheetWrap").hidden) drag = { mode: "open", x0: t.clientX, y0: t.clientY, t0: Date.now(), lock: null, dx: 0, x: closedX() };
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {
    if (!drag) return;
    const t = e.touches[0], dx = t.clientX - drag.x0, dy = t.clientY - drag.y0;
    if (drag.lock === null) {
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      drag.lock = Math.abs(dx) > Math.abs(dy) * 1.2 ? "x" : "y";
      if (drag.lock === "x" && drag.mode === "open") { drawerEl.style.visibility = "visible"; drawerEl.inert = false; }
    }
    if (drag.lock !== "x") return;
    if (e.cancelable) e.preventDefault();
    const cx = closedX(); drag.dx = dx;
    drag.x = drag.mode === "open" ? Math.min(0, Math.max(cx, cx + dx)) : Math.min(0, Math.max(cx, dx));
    dragTo(drag.x);
  }, { passive: false });
  const endDrag = () => {
    if (!drag) return;
    const d0 = drag; drag = null;
    if (d0.lock !== "x") return;
    const progress = 1 - d0.x / closedX(), speed = d0.dx / Math.max(1, Date.now() - d0.t0);      // pixels per millisecond
    const open = d0.mode === "open" ? (progress > 0.35 || speed > 0.5) : !(progress < 0.65 || speed < -0.5);
    for (const p of ["transition", "transform", "visibility"]) drawerEl.style[p] = "";
    scrimEl.style.transition = ""; scrimEl.style.opacity = "";
    setDrawer(open);
  };
  document.addEventListener("touchend", endDrag, { passive: true });
  document.addEventListener("touchcancel", endDrag, { passive: true });
  document.getElementById("restoreFile").addEventListener("change", (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ""; if (f) stageRestore(f); });

  window.addEventListener("resize", refit); window.addEventListener("orientationchange", refit);
  let lastW = window.innerWidth;
  window.addEventListener("resize", () => { if (window.innerWidth !== lastW) { lastW = window.innerWidth; render(); } });

  /* ---------- start ---------- */
  document.addEventListener("gesturestart", (e) => e.preventDefault());      // iOS pinch-zoom, which would otherwise stick
  function measureChrome() {                                       // keeps the pinned strip exactly under the app bar
    const ab = document.querySelector(".appbar"), st = $("strip"), r = document.documentElement.style;
    if (ab && ab.offsetHeight) r.setProperty("--appbar-h", ab.offsetHeight + "px");
    if (st && st.offsetHeight) r.setProperty("--strip-h", st.offsetHeight + "px");
  }
  window.addEventListener("resize", measureChrome);
  if (window.ResizeObserver) { const ro = new ResizeObserver(measureChrome); ro.observe(document.querySelector(".appbar")); ro.observe($("strip")); }
  applyTheme();
  applyLook();
  applyColors(getColors());
  load();
  loadUI();
  render();
  setDrawer(false);
  const m = location.hash.match(/^#b=([uz]\.[A-Za-z0-9_-]+)$/);
  if (m) {
    history.replaceState(null, "", location.href.split("#")[0]);       // keep the data out of the address bar and history
    fromToken(m[1]).then((d) => { stageData(d, ""); const inApp = window.navigator.standalone || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches); if (!inApp && state.pending) { state.pending.hint = "Tip: on iPhone, links open in Safari, which keeps its own data. To use this in your home-screen app, copy the link, open the app, then tap Manage and Paste."; render(); } })
      .catch((e) => { state.note = /newer/.test(e.message) ? "This link needs iOS 16.4 or newer to open." : "That budget link couldn’t be read."; render(); });
  }
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
